[project]
name = "geoweather-platform"
version = "0.1.0"
description = "GeoWeather Intelligence Platform Monorepo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.15.0",
    "redis>=5.0.0",
    "aiokafka>=0.11.0",
    "confluent-kafka>=2.4.0",
    "fastavro>=1.9.0",
    "h3>=4.0.0b4",
    "httpx>=0.27.0",
    "apscheduler>=4.0.0a1",
    "shapely>=2.0.0",
    "geopandas>=1.0.0",
    "pyproj>=3.6.0",
    "strawberry-graphql[fastapi]>=0.235.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "anthropic>=0.30.0",
    "google-genai>=0.3.0",
    "SpeechRecognition>=3.10.0",

    "pydantic>=2.7.0",
    "authlib>=1.3.0",
    "cachetools>=5.3.0",
    "lz4>=4.3.0",
    "cramjam>=2.7.0",
    "psycopg2-binary>=2.9.0"
]

[tool.uv]
workspace = { members = ["apps/api", "services/ingestion"] }
